{{- define "cv-matching.envSecret" -}}
AZURE__ENDPOINT: {{ .Values.azure.endpoint | quote }}
AZURE__REGION: {{ .Values.azure.region | quote }}
AZURE__KEY: {{ .Values.azure.key | quote }}
CV_MATCHING_LITELLM__URL: {{ .Values.litellm.url | quote }}
CV_MATCHING_LITELLM__API_KEY: {{ .Values.litellm.apiKey | quote }}
CV_MATCHING_LITELLM__MODEL: {{ .Values.litellm.model | quote }}
CV_MATCHING_LITELLM__TIMEOUT: {{ .Values.litellm.timeout | quote }}
CV_MATCHING_LITELLM__MAX_RETRIES: {{ .Values.litellm.maxRetries | quote }}
{{- if .Values.litellm.reasoningEffort }}
CV_MATCHING_LITELLM__REASONING_EFFORT: {{ .Values.litellm.reasoningEffort | quote }}
{{- end }}
AUTH__API_KEY: {{ .Values.auth.apiKey | quote }}
ROOT_PATH: {{ .Values.app.rootPath | quote }}
SERVICE_PREFIX: {{ .Values.app.servicePrefix | quote }}
API_PREFIX: {{ .Values.app.apiPrefix | quote }}
ENVIRONMENT: {{ .Values.app.environment | quote }}
{{- end -}}

{{- include "tplchart.secret" (dict
  "Args" (dict
    "stringData" (include "cv-matching.envSecret" .)
  )
  "context" .
) -}}
