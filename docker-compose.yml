services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv_matching_api
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/cv-matching/health').status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv_matching_network
    restart: unless-stopped

networks:
  cv_matching_network:
    driver: bridge
