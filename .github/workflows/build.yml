name: Build Image

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: false
        type: choice
        options:
          - latest
          - stable
        default: latest

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: harbor.sun-asterisk.vn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: image_metadata
        uses: docker/metadata-action@v5
        with:
          sep-tags: ","
          sep-labels: ","
          sep-annotations: ","
          tags: |
            type=raw,value=${{ inputs.type == 'stable' && 'stable' || '{{branch}}' }}
            type=raw,value={{date 'YYYY.MM.DD' tz='Asia/Ho_Chi_Minh'}},prefix=${{ inputs.type == 'stable' && 'stable-' || '{{branch}}-' }},suffix=-gha.r${{ github.run_number }}

      - name: Build image
        uses: docker/bake-action@v6
        env:
          REGISTRY: harbor.sun-asterisk.vn
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.image_metadata.outputs.bake-file }}
          targets: default
          push: true
          set: |-
            app.cache-to=type=gha,mode=max,scope=buildkit_app
            app.cache-from=type=gha,scope=buildkit_app
