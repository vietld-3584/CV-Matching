[project]
name = "cv-matching"
version = "1.0.0"
description = "Evidence-backed CV extraction and CV/JD matching API with clean architecture"
requires-python = ">=3.10"
dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Dependency Injection
    "dependency-injector>=4.42.0",
    # Document Parsing
    "azure-ai-documentintelligence>=1.0.2",
    # LLM
    "langchain-openai>=1.1.7",
    "langchain-core>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    # Monitoring
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_matching"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default, which widens between
# releases and would turn a clean tree red on an unrelated upgrade. This is the
# rule set the service was written against; broadening it is its own change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
